name: Docker images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [product-service, order-service, payment-service, api-gateway, web-client]
    steps:
      - uses: actions/checkout@v5
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: true
          tags: ordering/${{ matrix.service }}:latest

      - id: metadata
        name: Extract metadata (tags, labels)
        uses: docker/metadata-action@v5
        with:
          images: ordering/${{ matrix.service }}
          tags: |
            type=ref,event=branch,pattern={{ ref_name }}
            type=ref,event=tag,pattern={{ ref_name }}