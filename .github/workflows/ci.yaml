name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OrderingSystem.slnx
      - run: dotnet build OrderingSystem.slnx --no-restore -c Release
      - run: dotnet test OrderingSystem.slnx --no-build -c Release

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebClient
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/WebClient/package-lock.json
      - run: npm ci
      - run: npm run build
      # - run: npm test -- --watch=false   # once spec files exist

  docker-lint:
    name: Dockerfile + compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: Dockerfile          # finds every docker/*/Dockerfile
      - run: cp .env.example .env         # .env is git-ignored
      - run: docker compose config --quiet
      - run: for f in docker/*/Dockerfile; do docker build --check -f "$f" .; done
