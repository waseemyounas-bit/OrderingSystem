name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore OrderingSystem.slnx
      - run: dotnet build OrderingSystem.slnx --no-restore -c Release
      - run: dotnet test OrderingSystem.slnx --no-build -c Release

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebClient
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/WebClient/package-lock.json
      - run: npm ci
      - run: npm run build
      # - run: npm test -- --watch=false   # once spec files exist

  docker-lint:
    name: Dockerfile + compose check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: Dockerfile          # finds every docker/*/Dockerfile
      - run: cp .env.example .env         # .env is git-ignored
      - run: docker compose config --quiet
      - run: for f in docker/*/Dockerfile; do docker build --check -f "$f" .; done
    
  
  sonarqube:
    name: SonarQube Quality Gate
    needs: [backend, frontend, docker-lint]
    # Only on pushes to main: PRs from Dependabot/forks don't receive secrets (SONAR_TOKEN).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install SonarScanner
        run: |
          dotnet tool update --global dotnet-sonarscanner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Analyze .NET Solution
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          dotnet sonarscanner begin `
            /k:"$env:SONAR_PROJECT_KEY" `
            /d:sonar.host.url="$env:SONAR_HOST_URL" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.qualitygate.timeout=300

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet build OrderingSystem.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          dotnet sonarscanner end `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

