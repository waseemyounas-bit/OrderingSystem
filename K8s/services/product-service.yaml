# =====================================================================
#  ProductService - Deployment + Service
#  (order-service.yaml and payment-service.yaml follow the same pattern)
#
#  Deployment = "keep N identical pods of this image running".
#    - A pod dies       -> it's recreated.
#    - The image changes -> ROLLING UPDATE: new pods start, become Ready, then old ones stop
#                          (zero downtime thanks to the readinessProbe).
#  Service    = stable DNS name + virtual IP that load-balances across the READY pods.
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: product-service          # DNS name used by order-service and the gateway
spec:
  type: ClusterIP                # internal only - the outside world goes through the gateway
  selector:
    app: product-service         # traffic goes to pods with this label
  ports:
    - name: http
      port: 8080                 # Service port
      targetPort: http           # container port (by name, see below)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1                    # scale: kubectl scale deploy/product-service --replicas=3 -n ordering
  revisionHistoryLimit: 3        # old ReplicaSets kept for `kubectl rollout undo`
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      securityContext:
        runAsNonRoot: true       # refuse to start if the image would run as root (ours: USER $APP_UID)
      containers:
        - name: product-service
          # Placeholder name: kustomization.yaml (images:) replaces it with
          # waseembit/product-service:<tag>. The CD pipeline only changes that tag.
          image: product-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config         # ASPNETCORE_ENVIRONMENT, RabbitMq__Host, Seq__ServerUrl
          env:
            # Secret values as env vars...
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: POSTGRES_PASSWORD }
            # ...then reused inside another value with $(VAR) - Kubernetes expands it
            # (only works for variables defined ABOVE in this list).
            - name: ConnectionStrings__ProductDb
              value: Host=postgres;Port=5432;Database=productdb;Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_USER }
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef: { name: app-secrets, key: RABBITMQ_PASSWORD }
            - name: RabbitMq__QueueName
              value: product-service

          # ---- Probes (the 3 kinds) ----
          # startupProbe: on startup the app retries the DB for up to ~45s BEFORE it starts
          # listening. Until this probe succeeds, liveness/readiness are paused, so a slow
          # start isn't mistaken for a dead app. Here: up to 30 x 3s = 90s.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 30
          # livenessProbe: "is the process stuck?" -> failing = container RESTARTED.
          # Only checks the process itself (never the DB, or a DB outage would restart everything).
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # readinessProbe: "can I serve traffic?" (DB + RabbitMQ) -> failing = pod REMOVED from
          # the Service endpoints (no restart). Back in rotation once it passes again.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3

          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
